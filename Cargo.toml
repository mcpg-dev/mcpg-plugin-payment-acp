[package]
name = "mcpg-plugin-payment-acp"
version = "0.1.0-alpha.19"
license = "BUSL-1.1"
edition = "2024"
description = "Agentic Commerce Protocol (ACP) plugin for MCPG gateway"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
anyhow = "1.0"
# Kept for the dual-path async ToolGatePlugin impl
# (PaymentAware bound).
async-trait = "0.1"
dashmap = "6"
# `blocking` feature: ACP merchant API calls go through
# reqwest::blocking from the cdylib path.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
metrics = "0.24"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["cdylib-export"]
cdylib-export = []
# Declared so the SDK's per-kind `build_static` accessor
# (gated `#[cfg(feature = "static-firstparty")]`) does not trigger
# `unexpected_cfgs` in consumer compilation. Empty: this plugin is
# consumed as a cdylib, not via the static-firstparty fast path.
static-firstparty = []
